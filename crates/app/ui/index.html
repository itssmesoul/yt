<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiss Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1013;--panel:#151820;--raise:#222733;--line:#2A2F3A;--text:#ECEEF2;--dim:#9BA3B1;--red:#C8211C;--green:#4ADE80}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{display:flex;color:var(--text);font-family:'Inter Tight',system-ui,'Segoe UI',sans-serif;overflow:hidden;user-select:none}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.label{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.12em;color:var(--dim)}

aside{width:248px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:12px}
.brand i{width:36px;height:36px;border-radius:8px;background:var(--red);display:flex;align-items:center;justify-content:center}
.brand b{font-size:20px;font-weight:700;letter-spacing:-.02em}
nav{display:flex;flex-direction:column;gap:4px}
nav .label{padding:0 12px 8px}
.nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--dim);font-size:15px;font-weight:500;text-align:left}
.nav svg{stroke:var(--dim)}
.nav:hover{background:#1b1f29}
.nav.on{background:var(--raise);color:var(--text);font-weight:600}
.nav.on svg{stroke:var(--text)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:12px;line-height:1.6;color:var(--dim)}
.dir{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.dir .path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left;color:var(--text)}
.dir button{align-self:flex-start;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--dim);font-family:inherit;font-size:12px}
.dir button:hover{color:var(--text);border-color:var(--dim)}

main{flex:1;min-width:0;padding:40px 48px;display:flex;flex-direction:column;gap:28px;overflow-y:auto}
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.03em}
.sub{margin:8px 0 0;font-size:16px;color:var(--dim)}
.banner{background:#2a1716;border:1px solid #5a2220;color:#f3b3b0;border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.5}
.banner code{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:13px;color:#fff}

.row{display:flex;gap:12px}
#url{flex:1;min-width:0;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:14px;padding:0 16px;user-select:text;outline:none}
#url:focus{border-color:var(--dim)}
.fetch{height:52px;padding:0 28px;border-radius:10px;border:0;background:var(--red);color:#fff;font-size:16px;font-weight:600}
.fetch:hover:not(:disabled){filter:brightness(1.1)}
.err{color:#f3b3b0;font-size:14px;margin-top:-16px;user-select:text}

.card{display:flex;gap:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.card.idle .meta,.card.idle .ctrl{opacity:.55}
.thumb{width:264px;height:148px;flex:none;border-radius:10px;background:var(--raise);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
.ttl{font-size:20px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;user-select:text}
.by{margin-top:6px;font-size:14px;color:var(--dim)}
.ctrl{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{height:40px;padding:0 24px;border-radius:7px;border:0;background:transparent;color:var(--dim);font-size:15px;font-weight:600}
.seg button.on{background:var(--red);color:#fff}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--dim);font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:13px}
.pill.on{border-color:var(--text);color:var(--text)}
.dl{align-self:flex-start;height:44px;padding:0 24px;border-radius:10px;border:0;background:var(--text);color:var(--bg);font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
.dl:hover:not(:disabled){background:#fff}

.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:190px;border:1.5px dashed var(--line);border-radius:14px;background:var(--panel);color:var(--dim);font-size:15px;text-align:center;padding:24px}
.drop.over{border-color:var(--red);color:var(--text)}
.drop .ctrl{justify-content:center}
.drop .dl{align-self:center}

.cols{display:flex;gap:24px}
.cols>div{display:flex;flex-direction:column;gap:12px;min-width:0}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.q .top{display:flex;justify-content:space-between;gap:16px}
.q .top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.q .st{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;color:var(--dim);flex:none}
.q .st.ok{color:var(--green)}
.q .st.bad{color:#f87171}
.q.done{cursor:pointer}
.q.done:hover{border-color:var(--dim)}
.bar{height:6px;border-radius:3px;background:var(--raise);overflow:hidden}
.bar>div{height:6px;border-radius:3px;background:var(--red);transition:width .2s}
.bar.ind>div{width:35%!important;animation:ind 1.1s ease-in-out infinite alternate}
@keyframes ind{from{margin-left:0}to{margin-left:65%}}
.empty{color:var(--dim);font-size:14px;border:1px dashed var(--line);border-radius:12px;padding:14px 16px}
.err-msg{color:#f3b3b0;font-size:13px;user-select:text;word-break:break-word}
.qc{display:flex;flex-wrap:wrap;gap:8px}
.qc button{height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:13px}
.qc button:hover{border-color:var(--dim)}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <i><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="3.5" aria-hidden="true"><path d="M10 3v14M3 10h14"/></svg></i>
    <b>Swiss Kit</b>
  </div>
  <nav>
    <div class="label">DOWNLOAD</div>
    <button class="nav" data-page="youtube"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/></svg>YouTube</button>
    <button class="nav" data-page="tiktok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v11a4 4 0 1 1-4-4"/><path d="M14 3c0 3 2 5 5 5"/></svg>TikTok</button>
  </nav>
  <nav>
    <div class="label">CONVERT</div>
    <button class="nav" data-page="images"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Images</button>
    <button class="nav" data-page="audio"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Audio</button>
    <button class="nav" data-page="video"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 9h20M7 4v5M17 4v5"/></svg>Video</button>
  </nav>
  <div class="side-foot">
    <div class="dir">
      <span class="label">DOWNLOADS TO</span>
      <span class="path" id="dirPath" title=""></span>
      <button id="dirBtn">Change</button>
    </div>
    Built in Rust<br>Runs locally
  </div>
</aside>

<main>
  <div id="banner"></div>
  <div><h1 id="title"></h1><p class="sub" id="sub"></p></div>
  <div id="page" style="display:flex;flex-direction:column;gap:28px"></div>

  <section class="cols">
    <div style="flex:1.2">
      <div class="label">QUEUE</div>
      <div id="queue"></div>
    </div>
    <div style="flex:1">
      <div class="label">QUICK CONVERT</div>
      <div class="qc" id="qc"></div>
    </div>
  </section>
</main>

<script>
const T = window.__TAURI__;
const invoke = T.core.invoke;
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const DL_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E1013" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13M6 11l6 6 6-6M4 21h16"/></svg>';
const PLAY_ICON = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#9BA3B1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>';

const PAGES = {
  youtube: { kind: 'dl', title: 'YouTube downloader', sub: 'Paste a link, pick a format, save it.', ph: 'https://youtube.com/watch?v=...' },
  tiktok:  { kind: 'dl', title: 'TikTok downloader', sub: 'Paste a link, pick a format, save it.', ph: 'https://www.tiktok.com/@user/video/...' },
  images:  { kind: 'conv', title: 'Image converter', sub: 'Drop images here or pick them, then choose the target format.',
             exts: ['webp','png','jpg','jpeg','gif','bmp','tif','tiff','heic','heif'], targets: ['jpg','png','webp','gif','bmp','tiff'] },
  audio:   { kind: 'conv', title: 'Audio converter', sub: 'Drop audio files here or pick them, then choose the target format.',
             exts: ['mp3','wav','m4a','aac','ogg','flac','wma','opus'], targets: ['mp3','wav','m4a','ogg','flac'] },
  video:   { kind: 'conv', title: 'Video converter', sub: 'Drop videos here or pick them, then choose the target format.',
             exts: ['mp4','mov','mkv','avi','webm','gif','flv','wmv'], targets: ['mp4','webm','gif','mp3'] },
};

const QUICK = [
  ['WEBP','JPG',['webp']], ['PNG','JPG',['png']], ['HEIC','JPG',['heic','heif']],
  ['MP4','MP3',['mp4']], ['WAV','MP3',['wav']], ['MOV','MP4',['mov']], ['GIF','MP4',['gif']],
];

const state = {
  page: 'youtube',
  outDir: localStorage.getItem('outDir') || '',
  dl: {
    youtube: { url: '', info: null, format: 'mp4', height: null, busy: false, err: '' },
    tiktok:  { url: '', info: null, format: 'mp4', height: null, busy: false, err: '' },
  },
  conv: { images: 'jpg', audio: 'mp3', video: 'mp4' },
  jobs: [],
  nextId: 1,
};

/* ---------- helpers ---------- */
const fmtTime = s => {
  if (s == null) return '';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(x)}` : `${m}:${p(x)}`;
};
const baseName = p => p.split(/[\\/]/).pop();
const extOf = p => (baseName(p).split('.').pop() || '').toLowerCase();

/* ---------- jobs / queue ---------- */
function addJob(title, indeterminate) {
  const j = { id: state.nextId++, title, state: 'running', pct: 0, ind: !!indeterminate, path: null, msg: '' };
  state.jobs.unshift(j);
  renderQueue();
  return j;
}

function renderQueue() {
  const q = $('#queue');
  q.replaceChildren();
  q.style.cssText = 'display:flex;flex-direction:column;gap:12px';
  if (!state.jobs.length) { q.append(el('div', 'empty', 'Nothing yet. Downloads and conversions show up here.')); return; }
  for (const j of state.jobs.slice(0, 20)) {
    const box = el('div', 'q' + (j.state === 'done' ? ' done' : ''));
    const top = el('div', 'top');
    top.append(el('span', '', j.title));
    const st = el('span', 'st');
    if (j.state === 'running') st.textContent = j.ind ? 'Working…' : `${Math.round(j.pct)}%`;
    else if (j.state === 'done') { st.textContent = 'Done'; st.classList.add('ok'); }
    else { st.textContent = 'Failed'; st.classList.add('bad'); }
    top.append(st);
    box.append(top);
    if (j.state === 'running') {
      const bar = el('div', 'bar' + (j.ind ? ' ind' : ''));
      const fill = el('div'); fill.style.width = Math.max(2, j.pct) + '%';
      bar.append(fill); box.append(bar);
    }
    if (j.state === 'error') box.append(el('div', 'err-msg', j.msg));
    if (j.state === 'done' && j.path) { box.title = j.path; box.addEventListener('click', () => invoke('reveal', { path: j.path })); }
    q.append(box);
  }
}

T.event.listen('job', e => {
  const { id, kind, percent, path, message } = e.payload;
  const j = state.jobs.find(x => x.id === id);
  if (!j) return;
  if (kind === 'progress') { j.pct = percent ?? j.pct; j.ind = false; }
  else if (kind === 'done') { j.state = 'done'; j.pct = 100; j.path = path; }
  else { j.state = 'error'; j.msg = message || 'Unknown error'; }
  renderQueue();
});

/* ---------- conversions ---------- */
async function convertFiles(paths, target) {
  for (const p of paths) {
    const j = addJob(`${baseName(p)} → ${target.toUpperCase()}`, true);
    try { await invoke('start_convert', { id: j.id, input: p, to: target }); }
    catch (err) { j.state = 'error'; j.msg = String(err); renderQueue(); }
  }
}

async function pickFiles(exts) {
  const sel = await T.dialog.open({ multiple: true, filters: [{ name: 'Files', extensions: exts }] });
  if (!sel) return [];
  return Array.isArray(sel) ? sel : [sel];
}

/* ---------- pages ---------- */
function renderDl(root, name) {
  const cfg = PAGES[name], s = state.dl[name];

  const row = el('div', 'row');
  const input = el('input'); input.id = 'url'; input.type = 'text'; input.placeholder = cfg.ph; input.value = s.url; input.spellcheck = false;
  const fetchBtn = el('button', 'fetch', s.busy ? 'Fetching…' : 'Fetch'); fetchBtn.disabled = s.busy;
  row.append(input, fetchBtn);
  root.append(row);
  if (s.err) root.append(el('div', 'err', s.err));

  const info = s.info;
  const card = el('section', 'card' + (info ? '' : ' idle'));
  const thumb = el('div', 'thumb');
  if (info && info.thumbnail) { const im = el('img'); im.src = info.thumbnail; im.referrerPolicy = 'no-referrer'; im.onerror = () => { thumb.innerHTML = PLAY_ICON; }; thumb.append(im); }
  else thumb.innerHTML = PLAY_ICON;

  const col = el('div', 'info');
  const meta = el('div', 'meta');
  meta.append(el('div', 'ttl', info ? info.title : 'Video title appears here'));
  const parts = info
    ? [info.channel, fmtTime(info.duration), info.heights.length ? `${info.heights[0]}p available` : ''].filter(Boolean)
    : ['Channel name', '12:34', '1080p available'];
  meta.append(el('div', 'by', parts.join('  ·  ')));
  col.append(meta);

  const ctrl = el('div', 'ctrl');
  const seg = el('div', 'seg');
  for (const f of ['mp4', 'mp3']) {
    const b = el('button', s.format === f ? 'on' : '', f.toUpperCase());
    b.disabled = !info;
    b.addEventListener('click', () => { s.format = f; render(); });
    seg.append(b);
  }
  ctrl.append(seg);

  if (name === 'youtube' && s.format === 'mp4') {
    const pills = el('div', 'pills');
    const avail = info && info.heights.length ? info.heights : [1080, 720, 480];
    let opts = [1080, 720, 480].filter(h => !info || !info.heights.length || avail.some(a => a >= h));
    if (!opts.length) opts = [Math.max(...avail)];
    if (!opts.includes(s.height)) s.height = opts[0];
    for (const h of opts) {
      const b = el('button', 'pill' + (s.height === h ? ' on' : ''), `${h}p`);
      b.disabled = !info;
      b.addEventListener('click', () => { s.height = h; render(); });
      pills.append(b);
    }
    ctrl.append(pills);
  }
  col.append(ctrl);

  const dl = el('button', 'dl');
  dl.innerHTML = DL_ICON;
  dl.append(document.createTextNode(`Download ${s.format.toUpperCase()}`));
  dl.disabled = !info;
  dl.addEventListener('click', async () => {
    const j = addJob(info.title, false);
    try {
      await invoke('start_download', {
        id: j.id, platformName: name, url: s.url, format: s.format,
        maxHeight: name === 'youtube' && s.format === 'mp4' ? s.height : null,
        outDir: state.outDir,
      });
    } catch (err) { j.state = 'error'; j.msg = String(err); renderQueue(); }
  });
  col.append(dl);
  card.append(thumb, col);
  root.append(card);

  input.addEventListener('input', () => { s.url = input.value; });
  const doFetch = async () => {
    s.url = input.value.trim();
    if (!s.url) return;
    s.busy = true; s.err = ''; s.info = null; render();
    try { s.info = await invoke('fetch_info', { platformName: name, url: s.url }); s.height = null; }
    catch (err) { s.err = String(err); }
    s.busy = false; render();
  };
  fetchBtn.addEventListener('click', doFetch);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') doFetch(); });
}

function renderConv(root, name) {
  const cfg = PAGES[name];
  const drop = el('div', 'drop'); drop.id = 'drop';
  drop.append(el('div', '', 'Drop files here'));
  const ctrl = el('div', 'ctrl');
  ctrl.append(el('span', 'label', 'CONVERT TO'));
  const pills = el('div', 'pills');
  for (const t of cfg.targets) {
    const b = el('button', 'pill' + (state.conv[name] === t ? ' on' : ''), t.toUpperCase());
    b.addEventListener('click', () => { state.conv[name] = t; render(); });
    pills.append(b);
  }
  ctrl.append(pills);
  drop.append(ctrl);
  const pick = el('button', 'dl', 'Choose files');
  pick.addEventListener('click', async () => convertFiles(await pickFiles(cfg.exts), state.conv[name]));
  drop.append(pick);
  root.append(drop);
  root.append(el('div', 'sub', 'Converted files are saved next to the originals and never overwrite anything.'));
}

function render() {
  const name = state.page, cfg = PAGES[name];
  document.querySelectorAll('.nav').forEach(b => b.classList.toggle('on', b.dataset.page === name));
  $('#title').textContent = cfg.title;
  $('#sub').textContent = cfg.sub;
  const root = $('#page');
  root.replaceChildren();
  if (cfg.kind === 'dl') renderDl(root, name); else renderConv(root, name);
  $('#dirPath').textContent = state.outDir;
  $('#dirPath').title = state.outDir;
  renderQueue();
}

/* ---------- boot ---------- */
document.querySelectorAll('.nav').forEach(b => b.addEventListener('click', () => { state.page = b.dataset.page; render(); }));

$('#dirBtn').addEventListener('click', async () => {
  const d = await T.dialog.open({ directory: true, defaultPath: state.outDir || undefined });
  if (d) { state.outDir = d; localStorage.setItem('outDir', d); render(); }
});

const qc = $('#qc');
for (const [from, to, exts] of QUICK) {
  const b = el('button', '', `${from} → ${to}`);
  b.addEventListener('click', async () => convertFiles(await pickFiles(exts), to.toLowerCase()));
  qc.append(b);
}

// drag & drop onto converter pages
T.webview.getCurrentWebview().onDragDropEvent(ev => {
  const drop = $('#drop');
  const t = ev.payload.type;
  if (drop) drop.classList.toggle('over', t === 'over' || t === 'enter');
  if (t === 'drop' && PAGES[state.page].kind === 'conv') {
    const cfg = PAGES[state.page];
    const files = ev.payload.paths.filter(p => cfg.exts.includes(extOf(p)));
    if (files.length) convertFiles(files, state.conv[state.page]);
    if (drop) drop.classList.remove('over');
  }
  if (t === 'leave' && drop) drop.classList.remove('over');
});

(async () => {
  if (!state.outDir) state.outDir = await invoke('default_dir');
  const st = await invoke('tools_status');
  const miss = [];
  if (!st.ytdlp) miss.push('yt-dlp');
  if (!st.ffmpeg) miss.push('ffmpeg');
  if (miss.length) {
    const b = el('div', 'banner');
    b.append(document.createTextNode('Missing: '));
    const c = el('code', '', miss.join(', '));
    b.append(c, document.createTextNode('. Put the program next to Swiss Kit.exe or install it so it is on PATH.'));
    $('#banner').append(b);
  }
  render();
})();
</script>
</body>
</html>
