[package]
name = "swiss-kit-app"
version.workspace = true
edition.workspace = true

[dependencies]
swiss-kit-core = { path = "../core" }
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
